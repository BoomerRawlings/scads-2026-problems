name: Project 2 frozen agent matrix
on:
  push:
    branches: [codex/project2-acceptance-20261007]
    paths: [".github/workflows/project2-agent-matrix.yml"]
  workflow_dispatch:
    inputs:
      capture_run:
        description: Successful real-capture workflow run ID
        required: true
        default: "37705537519"
permissions:
  contents: read
  actions: read
concurrency:
  group: project2-agent-matrix-v1
  cancel-in-progress: false
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          xpack.ml.enabled: "false"
          ingest.geoip.downloader.enabled: "false"
          node.store.allow_mmap: "false"
          ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        ports: ["127.0.0.1:9200:9200"]
        options: >-
          --memory 4g --cpus 2
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 5s --health-retries 30
      kibana:
        image: docker.elastic.co/kibana/kibana:9.5.5
        env:
          ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
          TELEMETRY_OPTIN: "false"
          MAP_INCLUDEELASTICMAPSSERVICE: "false"
          STATUS_ALLOWANONYMOUS: "true"
          NODE_OPTIONS: "--max-old-space-size=1024"
        ports: ["127.0.0.1:5601:5601"]
        options: >-
          --memory 2g --cpus 1
          --health-cmd "curl --fail --silent http://localhost:5601/api/status"
          --health-interval 15s --health-timeout 10s --health-retries 40
    defaults:
      run:
        working-directory: projects/02-311-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable Maps inspection in the owned CI service
        timeout-minutes: 6
        env:
          KIBANA_CONTAINER: ${{ job.services.kibana.id }}
        run: |
          docker exec --user 0 -i "$KIBANA_CONTAINER" sh -c 'cat >> /usr/share/kibana/config/kibana.yml' <<'YAML'
          
          xpack.maps.showMapsInspectorAdapter: true
          xpack.maps.preserveDrawingBuffer: true
          YAML
          docker restart "$KIBANA_CONTAINER" > /dev/null
          deadline=$((SECONDS + 240))
          ready=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:5601/api/status > /dev/null; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
      - name: Install analytical and browser runtimes
        run: |
          python -m pip install ".[geo,mcp]" playwright
          python -m playwright install --with-deps chromium
          mkdir -p runs/runtime data
          python -m pip freeze > runs/runtime/python-packages.txt
          python -m analytics311 doctor > runs/runtime/host.json
          curl --fail --silent http://127.0.0.1:9200/ > runs/runtime/elasticsearch-version.json
          curl --fail --silent http://127.0.0.1:5601/api/status > runs/runtime/kibana-status.json
          docker stats --no-stream --format '{{json .}}' > runs/runtime/container-stats-start.jsonl
      - uses: actions/download-artifact@v4
        with:
          name: analytics311-real-capture
          path: projects/02-311-analytics/data/
          run-id: ${{ inputs.capture_run || '37705537519' }}
          github-token: ${{ github.token }}
      - name: Verify acquired bytes and stage official boundaries
        run: |
          python - <<'PY'
          import gzip,hashlib,json,urllib.request
          from pathlib import Path
          folder=Path('data');manifest=json.loads((folder/'april-october-2025.manifest.json').read_text())
          assert manifest['row_count'] >= 2000000 and manifest['bytes'] <= 2500000000
          digest=hashlib.sha256();size=0
          with gzip.open(folder/'april-october-2025.jsonl.gz','rb') as source,(folder/'april-october-2025.jsonl').open('xb') as dest:
              for chunk in iter(lambda:source.read(1024*1024),b''):
                  size+=len(chunk)
                  assert size <= manifest['bytes']
                  dest.write(chunk);digest.update(chunk)
          assert size == manifest['bytes'] and digest.hexdigest() == manifest['sha256']
          url='https://data.cityofnewyork.us/resource/9nt8-h7nd.geojson?%24select=nta2020%2Cntaname%2Cntatype%2Cthe_geom&%24order=nta2020&%24limit=1000'
          with urllib.request.urlopen(url,timeout=120) as response: raw=response.read(16*1024*1024+1)
          receipt=json.loads(Path('examples/evidence/official-nta2020-26b.json').read_text())
          assert len(raw) <= 16*1024*1024 and hashlib.sha256(raw).hexdigest() == receipt['sha256']
          (folder/'nta2020-26b.geojson').write_bytes(raw)
          Path('runs/runtime/acquisition.json').write_text(json.dumps({'captured_rows':manifest['row_count'],'captured_bytes':size,'sha256':digest.hexdigest(),'boundary_sha256':receipt['sha256']}))
          PY
      - name: Current regression suite
        run: python -m unittest discover -s tests -q
      - name: Normalize, reconcile, index, render and measure real corpus
        id: corpus
        continue-on-error: true
        timeout-minutes: 60
        run: |
          model_alias=$(python -c "import json;print(json.load(open('docs/local-model-runtime.json'))['model_alias'])")
          context_tokens=$(python -c "import json;print(json.load(open('docs/local-model-runtime.json'))['inference']['context_tokens'])")
          python tools/run_real_acceptance.py --raw data/april-october-2025.jsonl --boundaries data/nta2020-26b.geojson --nta-receipt examples/evidence/official-nta2020-26b.json --index nyc311-real-2025-v1 --output-dir runs/real-v1 --model "$model_alias"
      - name: Retain corpus evidence before agent inference
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: analytics311-corpus-evidence-${{ matrix.repetition }}
          path: |
            projects/02-311-analytics/runs/real-v1/
            projects/02-311-analytics/runs/runtime/
            !projects/02-311-analytics/runs/real-v1/*.sqlite
            !projects/02-311-analytics/runs/real-v1/normalized.jsonl
            !projects/02-311-analytics/runs/real-v1/normalized.jsonl.part
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
      - name: Bind replica to prospective campaign before inference
        id: replica
        if: ${{ always() && hashFiles('projects/02-311-analytics/runs/real-v1/agent-freeze.json') != '' }}
        run: python -m tools.agent_campaign verify-replica --protocol docs/agent-campaign-v1.json --root runs --repetition ${{ matrix.repetition }}
      - name: Verify exact negative development candidate is operationally executable
        id: development
        if: ${{ always() && hashFiles('projects/02-311-analytics/runs/real-v1/agent-freeze.json') != '' }}
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/BoomerRawlings/scads-2026-problems/actions/runs/38028703734 > runs/runtime/development-run.json
          gh api repos/BoomerRawlings/scads-2026-problems/actions/artifacts/11661052895 > runs/runtime/development-artifact.json
          gh api repos/BoomerRawlings/scads-2026-problems/actions/artifacts/11661052895/zip > runs/runtime/development-artifact.zip
          python - <<'PY'
          """Prospective workflow proposal, not an agent-quality grader or model invocation."""
          import json
          import math
          import re
          from pathlib import Path
          
          from tools import agent_evaluation as e
          from tools.local_agent import metadata_prefix_request, discovery_envelope
          
          RUN_ID = 38028703734
          HEAD_SHA = 'ffbbd5811c2b6ca949417b926dd56e3807e1e34d'
          ARTIFACT_ID = 11661052895
          ARTIFACT_SHA256 = '9664fa7851ebf9c4771012ea490cb322760a83ab87af917bb29f65653770d290'
          ARTIFACT_BYTES = 31348
          
          
          def require(condition, code):
              if not condition:
                  raise ValueError(code)
          
          
          def positive_number(value, maximum):
              return type(value) in (int, float) and math.isfinite(value) and 0 < value <= maximum
          
          
          def check(folder, run, artifact):
              folder = Path(folder)
              require(run.get('id') == RUN_ID and run.get('head_sha') == HEAD_SHA
                      and run.get('head_branch') == 'codex/project2-acceptance-20261007'
                      and run.get('status') == 'completed' and run.get('conclusion') == 'failure'
                      and run.get('path') == '.github/workflows/project2-model-smoke.yml'
                      and run.get('event') == 'push' and run.get('run_attempt') == 1,
                      'different_development_run')
              require(artifact.get('id') == ARTIFACT_ID
                      and artifact.get('name') == 'analytics311-development-model-smoke'
                      and artifact.get('size_in_bytes') == ARTIFACT_BYTES
                      and artifact.get('digest') == 'sha256:' + ARTIFACT_SHA256
                      and artifact.get('expired') is False
                      and artifact.get('workflow_run', {}).get('id') == RUN_ID
                      and artifact.get('workflow_run', {}).get('head_sha') == HEAD_SHA,
                      'different_development_artifact')
              current_spec = e.load('docs/local-model-runtime.json')
              spec = e.load('docs/local-model-runtime-qwen3-1-7b-startup300.json')
              require(e.sha_file('docs/local-model-runtime-qwen3-1-7b-startup300.json') ==
                      '2ff41f3779e8c2e342281239f06a22130474f622ab487ffdc2530e5e510a37d9', 'historical_spec_changed')
              require(e.sha_file('docs/local-model-runtime.json') ==
                      '0de2a21c278db7d268041173fdb73ab7b928c4f23e5a4dcccc5c44215df15b17', 'startup900_spec_changed')
              import copy
              amended_spec = copy.deepcopy(spec)
              amended_spec['inference']['prefix_warmup']['request_seconds'] = 900
              require(current_spec == amended_spec, 'nonstartup_runtime_amendment')
              historical_code = e.code_hashes()
              require(historical_code.get('tools/local_agent.py') ==
                      'ca4555771f7c3e99f4b7e1cd932d0a61fbe1e0dad882d0313f6d71b41fd371c7', 'startup900_adapter_changed')
              historical_code['tools/local_agent.py'] = '294a079720ddc9023c715a25bd81b442331647ab7ba167bf2d787966b4845436' 
              summary = e.load(folder / 'summary.json')
              trace = e.load(folder / 'trace.json')
              warm_path = folder / 'runtime/metadata-prefix-warmup.json'
              warm = e.load(warm_path)
              require(summary.get('passed') is False and summary.get('actual_agent_trials') == 1
                      and summary.get('evidence_kind') == 'actual_local_model_development_fixture_smoke'
                      and summary.get('held_out_evaluation') is False
                      and summary.get('real_data_acceptance') is False
                      and summary.get('overall_release_verified') is False,
                      'development_failure_relabelled')
              require(summary.get('runtime_profile') == 'native_openblas'
                      and summary.get('budgets') == {'seconds': 160, 'request_seconds': 120, 'max_calls': 24}
                      and summary.get('discovery_initiator') == 'adapter'
                      and summary.get('model_alias') == spec['model_alias']
                      and summary.get('model_identity', {}).get('model_id') == spec['model_alias']
                      and summary.get('runtime_spec_sha256') == e.sha_file('docs/local-model-runtime-qwen3-1-7b-startup300.json')
                      and summary.get('code_sha256') == historical_code, 'candidate_identity_changed')
              checks = summary.get('checks', {})
              require(checks == {'finished': True, 'answered': False, 'discovered_first': True,
                                'executed_unfiltered_count': False, 'numeric_evidence': False,
                                'cited_result': False, 'synthetic_label': False}, 'smoke_checks_changed')
              require(summary.get('fixture') == {'kind': 'synthetic_fixture', 'rows': 32,
                      'sha256': 'e34bba882616d4e04d9994642c2cc66effed110e3fa544039ef967d6da36997c'},
                      'different_development_fixture')
              require(trace.get('status') == 'finished' and trace.get('fresh_context') is True
                      and trace.get('model') == spec['model_alias'] and trace.get('seed') == 7
                      and trace.get('discovery_initiated_by') == 'adapter'
                      and trace.get('adapter_calls') == 1 and trace.get('model_calls') == 1
                      and trace.get('calls') == 2
                      and trace.get('final', {}).get('status') == 'needs_clarification'
                      and positive_number(trace.get('elapsed_seconds'), 160)
                      and summary.get('elapsed_seconds') == trace['elapsed_seconds'],
                      'development_trace_not_completed')
              events = trace.get('events', [])
              require(len(events) >= 4 and events[0].get('kind') == 'adapter_tool_call'
                      and events[0].get('initiated_by') == 'adapter'
                      and events[0].get('message') == discovery_envelope(), 'bootstrap_transport_changed')
              discovery = events[1]
              require(discovery.get('kind') == 'tool' and discovery.get('name') == 'describe_dataset'
                      and discovery.get('initiated_by') == 'adapter' and discovery.get('arguments') == {},
                      'bootstrap_discovery_missing')
              payload, expected = metadata_prefix_request(discovery['output'], spec['model_alias'])
              require(discovery.get('model_context', {}).get('content') == payload['messages'][2]['content']
                      and all(type(warm.get(key)) is type(value) and warm.get(key) == value
                              for key, value in expected.items()), 'warmup_metadata_binding_changed')
              policy = spec['inference']['prefix_warmup']
              require(warm.get('passed') is True and warm.get('schema_version') == 1
                      and warm.get('evidence_kind') == 'metadata_only_model_prefix_warmup'
                      and warm.get('model_alias') == spec['model_alias']
                      and warm.get('question_supplied') is False and warm.get('analytical_tool_calls') == 0
                      and warm.get('generated_content_retained') is False
                      and all(type(warm.get(key)) is type(value) and warm.get(key) == value
                              for key, value in policy.items())
                      and positive_number(warm.get('elapsed_seconds'), policy['request_seconds'])
                      and summary.get('prefix_warmup') == {'passed': True,
                          'elapsed_seconds': warm['elapsed_seconds'], 'receipt_sha256': e.sha_file(warm_path),
                          'policy': policy}, 'warmup_receipt_changed')
              usage = warm.get('usage', {})
              require(set(usage) == {'prompt_tokens', 'completion_tokens', 'total_tokens'}
                      and all(type(v) is int for v in usage.values()) and usage['prompt_tokens'] > 0
                      and usage['completion_tokens'] in (0, 1)
                      and usage['total_tokens'] == usage['prompt_tokens'] + usage['completion_tokens'],
                      'warmup_usage_invalid')
              model_events = [event for event in events if event.get('kind') == 'model']
              analytical = [event for event in events if event.get('kind') == 'tool'
                            and event.get('initiated_by') == 'model' and event.get('name') == 'run_analysis']
              require(len(model_events) == 3 and len(analytical) == 1
                      and all(event.get('message', {}).get('role') == 'assistant'
                              and type(event.get('usage', {}).get('prompt_tokens')) is int
                              and event['usage']['prompt_tokens'] > 0 for event in model_events),
                      'actual_model_tool_protocol_missing')
              call = model_events[0]['message'].get('tool_calls', [])
              require(len(call) == 1 and call[0].get('function', {}).get('name') == 'run_analysis'
                      and json.loads(call[0]['function']['arguments']) == analytical[0].get('arguments')
                      and analytical[0].get('output') == {'error': {'code': 'needs_clarification'}},
                      'actual_analytical_tool_response_missing')
              assets = e.load(folder / 'runtime/model-assets.json')
              require(assets.get('downloaded_and_hash_verified') is True
                      and all(assets.get(key) == value for key, value in spec.items()), 'model_assets_changed')
              expected_assets = [{'kind': name, 'filename': spec[name]['filename'],
                                  'bytes': spec[name]['size'], 'sha256': spec[name]['sha256']}
                                 for name in ('runtime', 'model')]
              require(assets.get('staged_assets') == expected_assets
                      and e.load(folder / 'runtime/asset-downloads.json') == expected_assets, 'asset_hashes_changed')
              build = e.load(folder / 'runtime/native-build.json')
              require(build.get('source_commit') == spec['execution_runtime']['source_commit']
                      and build.get('build_type') == 'Release' and build.get('native') is True
                      and build.get('blas') == 'OpenBLAS'
                      and re.fullmatch(r'[0-9a-f]{64}', str(build.get('binary_sha256', ''))), 'native_build_changed')
              cache = folder / 'runtime/native-cmake-cache.txt'
              values = {line.split(':', 1)[0]: line.split('=', 1)[1] for line in cache.read_text().splitlines()
                        if ':' in line and '=' in line and not line.startswith(('//', '#'))}
              require(all(values.get(flag[2:].split('=', 1)[0]) == flag[2:].split('=', 1)[1]
                          for flag in spec['execution_runtime']['cmake_flags']), 'native_flags_changed')
              return {'schema_version': 1, 'policy': 'negative-development-operational-eligibility-startup900-v1',
                      'eligible_to_execute': True, 'quality_qualified': False, 'development_passed': False,
                      'development_checks': checks, 'development_count_result': summary['count_result'],
                      'development_failed_check_count': sum(value is False for value in checks.values()),
                      'run': run, 'artifact': artifact, 'runtime_spec_sha256': summary['runtime_spec_sha256'],
                      'code_sha256': summary['code_sha256'], 'budgets': summary['budgets'],
                      'startup_amendment': {'previous_seconds': 300, 'current_seconds': 900,
                      'question_exposure_before_amendment': 0, 'current_runtime_spec_sha256': e.sha_file('docs/local-model-runtime.json'),
                      'current_code_sha256': e.code_hashes()},
                      'warmup_request_identity': expected, 'warmup_elapsed_seconds': warm['elapsed_seconds'],
                      'trial_elapsed_seconds': trace['elapsed_seconds'],
                      'artifact_files': {str(path.relative_to(folder)).replace('\\', '/'): e.sha_file(path)
                                         for path in sorted(folder.rglob('*')) if path.is_file()},
                      'scope': 'Negative development candidate with prospective startup-only 900-second amendment is operationally executable. The development question failed. '
                               'This does not pass, lower or replace any 120-trial quality, per-question, semantic or release gate.'}
          
          
          import hashlib,io,stat,zipfile
          archive=Path('runs/runtime/development-artifact.zip').read_bytes()
          require(len(archive)==ARTIFACT_BYTES and hashlib.sha256(archive).hexdigest()==ARTIFACT_SHA256, 'artifact_archive_changed')
          folder=Path('runs/development-qualification')
          folder.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              entries=bundle.infolist()
              require(len(entries)<=64 and sum(item.file_size for item in entries)<=2*1024*1024, 'artifact_archive_limit')
              names=set()
              for item in entries:
                  require(item.filename not in names and not item.filename.startswith(('/', '\\'))
                          and not stat.S_ISLNK(item.external_attr>>16), 'artifact_archive_entry')
                  names.add(item.filename)
                  target=(folder/item.filename).resolve()
                  require(target.is_relative_to(folder.resolve()), 'artifact_archive_path')
                  if item.is_dir():
                      target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      with target.open('xb') as stream:
                          stream.write(bundle.read(item))
          e.write_new('runs/runtime/development-eligibility.json',check(folder,
              e.load('runs/runtime/development-run.json'),e.load('runs/runtime/development-artifact.json')))
          PY
      - name: Stage pinned local model assets
        if: ${{ always() && steps.replica.outcome == 'success' && steps.development.outcome == 'success' && hashFiles('projects/02-311-analytics/runs/real-v1/agent-freeze.json') != '' }}
        timeout-minutes: 15
        run: |
          python - <<'PY'
          import hashlib,json,shutil,tarfile,time,urllib.request
          from pathlib import Path
          spec=json.loads(Path('docs/local-model-runtime.json').read_text());folder=Path('data/local-model');folder.mkdir()
          assert spec['target']=='Linux x86_64'
          assert spec['inference']['bind']=='127.0.0.1' and spec['inference']['port']==8080
          assert shutil.disk_usage(folder).free > 6*1024**3
          for name in ('runtime','model'):
              asset=spec[name];dest=folder/asset['filename'];digest=hashlib.sha256();size=0;start=time.monotonic()
              assert Path(asset['filename']).name==asset['filename']
              with urllib.request.urlopen(asset['url'],timeout=120) as source,dest.open('xb') as output:
                  for chunk in iter(lambda:source.read(1024*1024),b''):
                      size+=len(chunk)
                      assert size <= asset['size'] and time.monotonic()-start < 900
                      output.write(chunk);digest.update(chunk)
              assert size == asset['size'] and digest.hexdigest() == asset['sha256']
          target=folder/'runtime'
          with tarfile.open(folder/spec['runtime']['filename']) as archive:
              members=archive.getmembers()
              assert len(members)<=1000 and sum(member.size for member in members)<=512*1024**2
              for member in members:
                  assert (member.isfile() or member.isdir() or member.issym() or member.islnk()) and member.size>=0
              archive.extractall(target,members=members,filter='data')
          candidates=list(target.rglob('llama-server'))
          assert len(candidates)==1 and candidates[0].is_file()
          assert candidates[0].resolve().is_relative_to(target.resolve())
          Path('runs/runtime/model-assets.json').write_text(json.dumps(dict(spec,downloaded_and_hash_verified=True),indent=2))
          PY
      - name: Build pinned native CPU and OpenBLAS runtime
        if: ${{ always() && hashFiles('projects/02-311-analytics/runs/runtime/model-assets.json') != '' }}
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build libopenblas-dev
          mkdir data/local-model/source
          git -C data/local-model/source init -q
          git -C data/local-model/source remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C data/local-model/source fetch --depth 1 origin 5ad1c5da0ad7f6176256b823925aad19134f0263
          git -C data/local-model/source checkout --detach FETCH_HEAD
          test "$(git -C data/local-model/source rev-parse HEAD)" = 5ad1c5da0ad7f6176256b823925aad19134f0263
          git -C data/local-model/source rev-parse HEAD > runs/runtime/native-source-commit.txt
          cmake -S data/local-model/source -B data/local-model/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_BACKEND_DL=OFF -DGGML_NATIVE=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build data/local-model/native --parallel 4 --target llama-server llama-bench
          lscpu > runs/runtime/cpu.txt
          c++ --version > runs/runtime/compiler.txt
          dpkg-query -W libopenblas-dev > runs/runtime/blas-package.txt
          cp data/local-model/native/CMakeCache.txt runs/runtime/native-cmake-cache.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          binary=Path('data/local-model/native/bin/llama-server')
          receipt={'source_commit':'5ad1c5da0ad7f6176256b823925aad19134f0263','build_type':'Release','native':True,'blas':'OpenBLAS','binary_sha256':hashlib.sha256(binary.read_bytes()).hexdigest()}
          Path('runs/runtime/native-build.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Execute 40 fresh-context agent trials
        if: ${{ always() && hashFiles('projects/02-311-analytics/runs/runtime/native-build.json') != '' }}
        timeout-minutes: 130
        continue-on-error: true
        env:
          REPETITION: ${{ matrix.repetition }}
        run: |
          server=$(realpath data/local-model/native/bin/llama-server)
          export OPENBLAS_NUM_THREADS=4
          test -n "$server"
          model_file=$(python -c "import json;print(json.load(open('docs/local-model-runtime.json'))['model']['filename'])")
          model_alias=$(python -c "import json;print(json.load(open('docs/local-model-runtime.json'))['model_alias'])")
          context_tokens=$(python -c "import json;print(json.load(open('docs/local-model-runtime.json'))['inference']['context_tokens'])")
          export LD_LIBRARY_PATH="$(dirname "$server"):${LD_LIBRARY_PATH:-}"
          "$server" --version > runs/runtime/llama-version-r${REPETITION}.txt 2>&1
          "$server" -m "data/local-model/$model_file" --host 127.0.0.1 --port 8080 --alias "$model_alias" --threads 4 --threads-batch 4 --batch-size 2048 --ubatch-size 512 --ctx-size "$context_tokens" --parallel 1 --gpu-layers 0 --jinja --reasoning off --reasoning-budget 0 --no-context-shift > runs/runtime/model-server-r${REPETITION}.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          for attempt in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2) as response: ready=json.load(response)
                  if ready.get('status') == 'ok': break
              except OSError: pass
              time.sleep(1)
          else: raise RuntimeError('Local model did not become ready')
          Path('runs/runtime/model-health-r'+os.environ['REPETITION']+'.json').write_text(json.dumps(ready))
          PY
          export SERVER_PID="$server_pid" CMAKE_CACHE="data/local-model/native/CMakeCache.txt" SOURCE_COMMIT_FILE="runs/runtime/native-source-commit.txt" REP="$REPETITION"
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import os,re
          from tools import agent_evaluation as e
          spec=e.load('docs/local-model-runtime.json');pid=int(os.environ['SERVER_PID']);proc=Path('/proc')/str(pid)
          argv=[os.fsdecode(v) for v in (proc/'cmdline').read_bytes().split(b'\0') if v]
          server=(proc/'exe').resolve(strict=True);flag='-m' if '-m' in argv else '--model';model=Path(argv[argv.index(flag)+1]).resolve(strict=True)
          cache=Path(os.environ['CMAKE_CACHE']).resolve(strict=True);revision=Path(os.environ['SOURCE_COMMIT_FILE']).resolve(strict=True)
          assert revision.read_text().strip()==spec['execution_runtime']['source_commit']
          cache_values={line.split(':',1)[0]:line.split('=',1)[1] for line in cache.read_text().splitlines() if ':' in line and '=' in line and not line.startswith(('//','#'))}
          for entry in spec['execution_runtime']['cmake_flags']:
              name,value=entry[2:].split('=',1);assert cache_values.get(name)==value
          libraries=set()
          for line in (proc/'maps').read_text().splitlines():
              parts=line.split(maxsplit=5)
              if len(parts)==6 and parts[5].startswith('/') and re.search(r'\.so(?:\.|$)',Path(parts[5]).name):libraries.add(Path(parts[5]).resolve(strict=True))
          items=[('model',model),('server',server),('build_configuration',cache),('source_revision',revision)]+[('runtime_library',p) for p in sorted(libraries)]
          files=[{'role':role,'path':str(p),'bytes':p.stat().st_size,'sha256':e.sha_file(p)} for role,p in items]
          receipt={'schema_version':1,'evidence_kind':'pretrial_local_model_runtime','created_at':datetime.now(timezone.utc).isoformat(),'freeze_sha256':e.sha_file('runs/real-v1/agent-freeze.json'),'runtime_spec_sha256':e.sha_file('docs/local-model-runtime.json'),'model_alias':spec['model_alias'],'execution_runtime':spec['execution_runtime'],'endpoint':'http://127.0.0.1:8080/v1','budgets':{'seconds':160,'request_seconds':120,'max_calls':24},'owned_server_pid':pid,'launch_argv':argv,'files':files}
          e.write_new('runs/runtime/agent-runtime-freeze-r'+os.environ['REP']+'.json',receipt)
          PY
          config=$(python -c "import json;print('runs/real-v1/'+json.load(open('runs/real-v1/acceptance.json'))['agent_config'])")
          if python tools/agent_evaluation.py run --config "$config" --freeze runs/real-v1/agent-freeze.json --database runs/real-v1/oracle.sqlite --endpoint http://127.0.0.1:8080/v1 --output runs/agent-v1 --seconds 160 --request-seconds 120 --repetition "$REPETITION" --runtime-receipt runs/runtime/agent-runtime-freeze-r${REPETITION}.json; then
            evaluation_exit=0
          else
            evaluation_exit=$?
          fi
          export EVALUATION_EXIT="$evaluation_exit"
          python - <<'PY'
          import json,os
          from pathlib import Path
          repetition=int(os.environ['REPETITION'])
          frozen=json.loads(Path('runs/real-v1/agent-freeze.json').read_text())
          expected={f"{case['id']}-r{repetition}.json" for case in frozen['cases']}
          actual={p.name for p in Path('runs/agent-v1').glob('Q*-r*.json')}
          report=json.loads(Path('runs/agent-v1/summary.json').read_text())
          exit_code=int(os.environ['EVALUATION_EXIT'])
          receipt={'repetition':repetition,'evaluator_exit_code':exit_code,
                   'expected_trial_records':len(expected),'actual_trial_records':len(actual),
                   'exact_trial_files':actual==expected,'execution_complete':report.get('execution_complete'),
                   'quality_denominator':120,'quality_verdict':'deferred_to_campaign_merge'}
          Path(f'runs/runtime/replica-execution-r{repetition}.json').write_text(json.dumps(receipt,indent=2))
          assert exit_code in (0,1), 'Unexpected evaluator failure'
          assert len(expected)==40 and actual==expected, 'Forty actual trial records required'
          assert report.get('execution_complete') is True and report.get('attempted_trials')==40
          PY
      - name: Preserve final resource observations
        if: always()
        run: |
          docker stats --no-stream --format '{{json .}}' > runs/runtime/container-stats-end.jsonl
          df -B1 . > runs/runtime/disk-end.txt
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          for log in sorted(Path('runs/runtime').glob('model-server-r*.log')):
              with log.open(errors='replace') as source: tail=''.join(deque(source,maxlen=120))
              log.with_name(log.stem+'-tail.txt').write_text(tail)
          PY
      - name: Retain immutable replica, failures and runtime receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics311-agent-replica-${{ matrix.repetition }}
          path: |
            projects/02-311-analytics/runs/real-v1/
            projects/02-311-analytics/runs/agent-v1/
            projects/02-311-analytics/runs/runtime/
            !projects/02-311-analytics/runs/**/*.sqlite
            !projects/02-311-analytics/runs/**/normalized.jsonl
            !projects/02-311-analytics/runs/**/normalized.jsonl.part
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
  merge:
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/02-311-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[geo,mcp]"
      - uses: actions/download-artifact@v4
        with:
          pattern: analytics311-agent-replica-*
          path: projects/02-311-analytics/runs/replicas/
      - name: Recompute fixed 120-trial campaign gates
        if: always()
        run: |
          replicas=()
          for repetition in 1 2 3; do
            path="runs/replicas/analytics311-agent-replica-$repetition"
            if [ -d "$path" ]; then replicas+=(--replica "$repetition=$path"); fi
          done
          mkdir -p runs/campaign
          if python -m tools.agent_campaign merge --protocol docs/agent-campaign-v1.json "${replicas[@]}" --output runs/campaign/automatic-review.json > runs/campaign/merge-stdout.txt 2> runs/campaign/merge-stderr.txt; then
            merge_exit=0
          else
            merge_exit=$?
          fi
          export MERGE_EXIT="$merge_exit"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          result=Path('runs/campaign/automatic-review.json')
          protocol=Path('docs/agent-campaign-v1.json')
          receipt={'evidence_kind':'campaign_merge_execution','exit_code':int(os.environ['MERGE_EXIT']),
                   'quality_denominator':120,'report_written':result.exists(),
                   'protocol_sha256':hashlib.sha256(protocol.read_bytes()).hexdigest(),
                   'report_sha256':hashlib.sha256(result.read_bytes()).hexdigest() if result.exists() else None,
                   'replica_directories':[str(p) for p in sorted(Path('runs/replicas').glob('analytics311-agent-replica-*'))],
                   'failure_policy':'Supplied incomplete or corrupt evidence fails closed; no existing replica is silently omitted.'}
          Path('runs/campaign/merge-execution.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
          cat runs/campaign/merge-stdout.txt runs/campaign/merge-stderr.txt
          exit "$merge_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics311-agent-campaign-automatic
          path: projects/02-311-analytics/runs/campaign/
          retention-days: 30
          if-no-files-found: warn
