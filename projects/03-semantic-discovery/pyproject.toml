[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vopt-discovery"
version = "0.1.0"
description = "Offline extraction and controlled metadata-only discovery for technical manuals"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
extraction = ["PyMuPDF>=1.24,<2", "rapidocr-onnxruntime>=1.4,<2", "Pillow>=10,<13"]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]

[project.scripts]
vopt = "vopt.cli:main"

[tool.setuptools.packages.find]
include = ["vopt*"]

[tool.setuptools.package-data]
vopt = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
