[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scads-orggraph"
version = "0.1.0"
description = "Evidence-backed organizational graph inference and local analyst explorer"
requires-python = ">=3.12,!=3.14.1"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18,<1", "networkx>=3.4,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
orggraph = "orggraph.cli:main"

[tool.setuptools.packages.find]
include = ["orggraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
